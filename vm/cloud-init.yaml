#cloud-config
# First-boot setup for the "devbox" VM (Ubuntu 24.04 server).
# Used by create-vm.ps1: multipass launch ... --cloud-init cloud-init.yaml
# Installs: git, build tools, Python 3, Node.js LTS, Docker. Turns on a firewall.

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - wget
  - unzip
  - htop
  - build-essential
  - ca-certificates
  - python3
  - python3-pip
  - python3-venv
  - docker.io
  - docker-compose-v2
  - ufw

runcmd:
  # Node.js LTS from NodeSource
  - curl -fsSL https://deb.nodesource.com/setup_lts.x -o /tmp/nodesource_setup.sh
  - bash /tmp/nodesource_setup.sh
  - apt-get install -y nodejs
  # Docker without sudo for the default user
  - usermod -aG docker ubuntu
  - systemctl enable --now docker
  # Firewall: SSH plus common dev-server ports
  - ufw allow OpenSSH
  - ufw allow 3000/tcp
  - ufw allow 8000/tcp
  - ufw --force enable
  - mkdir -p /home/ubuntu/projects
  - chown ubuntu:ubuntu /home/ubuntu/projects

final_message: "devbox is ready after $UPTIME seconds"
