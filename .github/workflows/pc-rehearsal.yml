# PC rehearsal: follows JDOLLA/SuperOS/START-HERE.md line by line on Windows, on a fresh clone in a temp folder outside
# the checkout. Only the Claude CLI (a fake) and the embedding download (skipped) are stubbed; see bridge/pc-rehearsal.ts.
# Runs by hand and weekly (and on a pull request that changes the rehearsal itself). No secrets; it reads the repo only.
name: PC rehearsal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths:
      - ".github/workflows/pc-rehearsal.yml"
      - "JDOLLA/SuperOS/os/bridge/pc-rehearsal.ts"

permissions:
  contents: read

concurrency:
  group: pc-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0 # the rehearsal pushes this commit into a local "origin" for the clone to pull from
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.x
      - name: Follow START-HERE on a fresh clone
        shell: pwsh
        run: node JDOLLA/SuperOS/os/bridge/pc-rehearsal.ts "$env:GITHUB_WORKSPACE" "$env:RUNNER_TEMP\pc-rehearsal" "$env:RUNNER_TEMP\pc-rehearsal-logs"
      - name: Save each step's output (scrubbed of runner paths and the user name)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pc-rehearsal-logs
          path: ${{ runner.temp }}/pc-rehearsal-logs
          retention-days: 30
          if-no-files-found: error
