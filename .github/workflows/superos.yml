# SuperOS checks on Linux and Windows (ROADMAP 9a). No secrets; never calls the real Claude CLI:
# every bridge test and the smoke run use the fake CLI in os/bridge/fake-claude.ts.
name: superos

on:
  pull_request:
    paths:
      - "JDOLLA/SuperOS/**"
      - ".claude/skills/blender-visuals/SKILL.md" # bridge/blender-check.test.ts pins its Verify first step
      - ".github/workflows/superos.yml"
  push:
    branches: [main]
    paths:
      - "JDOLLA/SuperOS/**"
      - ".claude/skills/blender-visuals/SKILL.md" # bridge/blender-check.test.ts pins its Verify first step
      - ".github/workflows/superos.yml"

permissions:
  contents: read

concurrency:
  group: superos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: JDOLLA/SuperOS/os
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: JDOLLA/SuperOS/os/package-lock.json
      - run: node --version
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          # spec ends with a list of the failing tests, so a red job names them at the bottom of its log
          NODE_OPTIONS: --test-reporter=spec
      - run: npm run eval:router
      - run: npm run smoke
