<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ship in a Bottle</title>
<style>

@font-face { font-family: 'Cormorant'; font-style: italic; src: url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2); font-weight: 500; }

html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; font-family: Inter, sans-serif; }
canvas { display: block; position: absolute; }
.ui { position: absolute; color: #e9e3d4; }
/* ---------- style A ---------- */
body.A { background: radial-gradient(ellipse 70% 75% at 52% 46%, #33605f 0%, #23494b 45%, #15302f 100%); }
body.A #cv { left: 0; top: 0; }
.A .kicker { left: 40px; top: 28px; font-size: 5.5px; letter-spacing: 1.6px; color: #b7c8c3; font-weight: 600; }
.A .kicker::before { content: ''; display: inline-block; width: 12px; height: 1px; background: #b7c8c3; vertical-align: middle; margin-right: 5px; }
.A .title { left: 39px; top: 34px; font-family: Cormorant; font-size: 38px; font-weight: 500; letter-spacing: -0.6px; color: #f2ecdd; }
.A .title i { color: #e8c98e; }
.A .pills { right: 40px; top: 30px; display: flex; gap: 4px; }
.A .pill { height: 16px; border: 1px solid rgba(255,255,255,.18); border-radius: 9px; font-size: 5.5px; display: flex; align-items: center; padding: 0 6px; color: #e9eee9; background: rgba(10,30,30,.3); }
.A .round { width: 16px; padding: 0; justify-content: center; }
.A .hint { left: 40px; bottom: 26px; display: flex; gap: 8px; align-items: center; font-size: 5.5px; color: #d5ddd8; }
.A .hint b { display: block; font-weight: 600; font-size: 6px; color: #f0f0ea; }
.A .compass { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #c8d2cd; position: relative; }
.A .compass::after { content: '✦'; position: absolute; left: 3px; top: 0px; font-size: 10px; color: #dfe5e0; }
.A .sea { right: 40px; bottom: 24px; display: flex; align-items: center; gap: 8px; font-size: 5px; letter-spacing: 1.4px; color: #b9c6c1; font-weight: 600; }
.A .seg { display: flex; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 2px; gap: 2px; background: rgba(10,30,30,.35); }
.A .seg span { font-size: 5.5px; letter-spacing: 0; padding: 3px 7px; border-radius: 8px; color: #e1e7e3; font-weight: 500; }
.A .seg .on { background: #e7c393; color: #2a2116; }
/* ---------- style B ---------- */
body.B { background: #0f1c1f; }
.B .title { left: 106px; top: 2px; font-family: Instrument; font-size: 56px; letter-spacing: -1.2px; color: #efe9da; line-height: 1; }
.B .title i { color: #efe0bb; }
.B .desc { left: 953px; top: 28px; font-size: 8.6px; line-height: 16px; color: #b9c4c0; width: 230px; }
.B .rule { left: 106px; top: 77px; width: 1068px; height: 1px; background: #2b3b3d; }
.B .frame { left: 106px; top: 79px; width: 1068px; height: 606px; background: radial-gradient(ellipse 60% 65% at 50% 55%, #1e3a3b 0%, #142a2c 55%, #0c1a1c 100%); overflow: hidden; }
.B #cv { left: 0; top: 0; }
.B .corner { position: absolute; width: 8px; height: 8px; border: 1px solid #6f7f7c; }
.B .c1 { left: 8px; top: 8px; border-right: 0; border-bottom: 0; } .B .c2 { right: 8px; top: 8px; border-left: 0; border-bottom: 0; }
.B .c3 { left: 8px; bottom: 8px; border-right: 0; border-top: 0; } .B .c4 { right: 8px; bottom: 8px; border-left: 0; border-top: 0; }
.B .comp { position: absolute; left: 17px; top: 17px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid #3b4d4e; background: #10201f; }
.B .comp::after { content: ''; position: absolute; left: 8px; top: 13px; width: 14px; height: 3px; background: #d9c7a0; transform: rotate(28deg); border-radius: 2px; }
.B .drag { position: absolute; left: 16px; bottom: 14px; font-family: Mono; font-size: 8px; color: #b9c2bf; }
.B .reset { position: absolute; right: 16px; bottom: 6px; border: 1px solid #3a4a4b; border-radius: 3px; font-size: 8px; padding: 6px 9px; color: #e3e3da; font-weight: 600; background: #0f1d1f; }
.B .bar { left: 106px; top: 690px; width: 1068px; display: flex; align-items: center; gap: 10px; font-size: 7.5px; }
.B .bar .lab { font-family: Mono; letter-spacing: 1.5px; color: #c9a86e; margin-left: 16px; }
.B .bar .seg { display: flex; border: 1px solid #2f4041; border-radius: 3px; padding: 2px; gap: 2px; }
.B .bar .seg span { padding: 5px 12px; color: #dfe1da; font-size: 8px; font-weight: 500; border-radius: 2px; }
.B .bar .seg .on { background: #d9be8d; color: #1d1a13; }
.B .bar .note { font-family: Mono; color: #9aa7a3; font-size: 8px; }
.B .bar .pause { margin-left: auto; border: 1px solid #3a4a4b; border-radius: 3px; padding: 6px 13px; font-size: 8px; color: #e3e3da; font-weight: 600; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>

<body>
<script type="module">
import { createScene } from './src/scene.js';
const style = new URLSearchParams(location.search).get('style') || 'A';
document.body.className = style;
const cv = document.createElement('canvas'); cv.id = 'cv';
if (style === 'A') {
  document.body.innerHTML = `
    <div class="ui kicker">SHIP IN A BOTTLE</div>
    <div class="ui title">Lantern <i>Strait</i></div>
    <div class="ui pills"><div class="pill">⌕&nbsp; Inspect ship</div><div class="pill round">❙❙</div><div class="pill round">⛶</div></div>
    <div class="ui hint"><div class="compass"></div><div><b>Drag to orbit</b>Scroll to zoom · Tap the sea to ripple</div></div>
    <div class="ui sea">SEA STATE <div class="seg"><span>Calm</span><span class="on">Swell</span><span>Squall</span></div></div>`;
  document.body.prepend(cv);
  window.__ctx = createScene(cv, 'A', 1280, 720);
} else {
  document.body.innerHTML = `
    <div class="ui title">The <i>Bottled Sea</i></div>
    <div class="ui desc">A three-masted ship rides the swell past Lantern Cay.<br>Look below the waterline for the reef.</div>
    <div class="ui rule"></div>
    <div class="ui frame" id="frame"><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
      <div class="comp"></div><div class="drag">Drag to orbit &nbsp;·&nbsp; Scroll to zoom</div><div class="reset">↺&nbsp; Reset view</div></div>
    <div class="ui bar"><span class="lab">SEA STATE</span><div class="seg"><span>Calm</span><span class="on">Swell</span><span>Gale</span></div><span class="note">Rolling waves, steady wind</span><span class="pause">❙❙&nbsp; Pause</span></div>`;
  const frame = document.getElementById('frame');
  frame.prepend(cv);
  window.__ctx = createScene(cv, 'B', 1068, 606);
}
await document.fonts.ready;
window.renderAt = (t) => window.__ctx.renderAt(t);
window.renderAt(0);
window.__ready = true;
</script>
</body>
</html>
